[project]
name = "python-chatbot"
version = "0.1.0"
description = "Beginner-friendly terminal AI chatbot with pluggable providers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
